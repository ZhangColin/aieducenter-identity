server:
  port: 10001

spring:
  application:
    name: aieducenter-identity
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    table: aieducenter-identity_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

# Security 拦截配置
cartisan:
  security:
    interceptor:
      path-patterns:
        - "/**"
      exclude-path-patterns:
        - "/error"
        - "/actuator/**"
        - "/auth/login"
        - "/auth/captcha"
        - "/health"
        - "/swagger-ui/**"
        - "/api-docs/**"
        # verification 上下文公开端点（登录前下发/校验验证码，无需鉴权）
        - "/api/captcha"
        - "/api/account/verification-code/**"
        - "/api/account/verify-code"
        # refresh 端点凭 refresh_token 本身鉴权，无需登录态（issue #13）
        - "/api/account/refresh"
        # OIDC/SSO 协议端点（issue #15/#17）：自身走协议鉴权（code/client_secret/access token 验签）或公开，不经 sa-token
        - "/authorize"
        - "/token"
        - "/userinfo"
        - "/jwks"
        - "/.well-known/**"
        - "/api/auth/**"
  openapi:
    self:
      app-id: ${OPENAPI_APP_ID:}
      app-secret: ${OPENAPI_APP_SECRET:}
    apikey-service-url: https://openapi.aieducenter.com/api/v1/api-keys/by-appId

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid

# JWT token 配置（ADR-0002 / issue #11）
# access JWT 兼作 Sa-Token 会话 token（每次登录用 SaLoginParameter.setTimeout 对齐有效期，故全局 sa-token.timeout 不动）。
# private-key-path / public-key-path 默认不设 → 内存生成临时密钥（重启失效，prod 必须配 PEM）。
identity:
  token:
    jwt:
      issuer: https://identity.aieducenter.com
      access-ttl-seconds: 900
      refresh-ttl-seconds: 604800
      key-id: identity-rs256-v1
      audiences:
        - aieducenter-identity
  # SSO 配置（ADR-0004 / issue #15）——一套 SSO 会话（cookie+Redis+双超时）+ 授权码 + client stub
  sso:
    session-idle-seconds: 2592000      # 闲置超时 30 天（Redis key TTL 滑动）
    session-absolute-seconds: 7776000   # 绝对超时 90 天
    code-ttl-seconds: 60                # 授权码 60s 一次性
    cookie-name: sso_session
    cookie-secure: true
    login-page-url: https://login.company.com/login
    protected-paths:
      - /api/account/me
      - /api/account/profile
    # client 查询 stub（dev/测试便利；真 app-registry 接入在 #6）
    stub-client-id: demo-client
    stub-client-secret: demo-secret-please-change
    stub-redirect-uris:
      - https://demo.localhost/auth/callback

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
