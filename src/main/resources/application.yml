server:
  port: 10001

spring:
  application:
    name: aieducenter-identity
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    table: aieducenter-identity_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

# Security 拦截配置
cartisan:
  security:
    interceptor:
      path-patterns:
        - "/**"
      exclude-path-patterns:
        - "/error"
        - "/actuator/**"
        - "/auth/login"
        - "/auth/captcha"
        - "/health"
        - "/swagger-ui/**"
        - "/api-docs/**"
        # verification 上下文公开端点（登录前下发/校验验证码，无需鉴权）
        - "/api/captcha"
        - "/api/account/verification-code/**"
        - "/api/account/verify-code"
  openapi:
    self:
      app-id: ${OPENAPI_APP_ID:}
      app-secret: ${OPENAPI_APP_SECRET:}
    apikey-service-url: https://openapi.aieducenter.com/api/v1/api-keys/by-appId

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid

# JWT token 配置（ADR-0002 / issue #11）
# access JWT 兼作 Sa-Token 会话 token（每次登录用 SaLoginParameter.setTimeout 对齐有效期，故全局 sa-token.timeout 不动）。
# private-key-path / public-key-path 默认不设 → 内存生成临时密钥（重启失效，prod 必须配 PEM）。
identity:
  token:
    jwt:
      issuer: https://identity.aieducenter.com
      access-ttl-seconds: 900
      key-id: identity-rs256-v1
      audiences:
        - aieducenter-identity

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
