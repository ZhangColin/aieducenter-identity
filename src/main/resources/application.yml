server:
  port: 10001

spring:
  application:
    name: aieducenter-identity
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    table: aieducenter-identity_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

# 服务间签名（机机）：identity 出站（如调 app-registry bootstrap）带 cartisan-openapi 签名头（#31）。
cartisan:
  openapi:
    self:
      # 身份自身凭据（app-registry 颁发）；prod 走 env 真凭据，local/test 见各 profile 占位。
      api-key: ${OPENAPI_API_KEY:}
      api-secret: ${OPENAPI_API_SECRET:}
    # 出站超时（#31）：app-registry bootstrap 在 SSO 登录热路径上，收窄到 3s/5s（框架默认 10/30）。
    timeout:
      connect-seconds: ${OPENAPI_CONNECT_TIMEOUT:3}
      read-seconds: ${OPENAPI_READ_TIMEOUT:5}
    # 入站机机验签的凭据查询端点（#46 迁移到 app-registry 统一凭据源，对齐 payment 迁移）：
    #   GET {APP_REGISTRY_BASE_URL}/api/app-registry/api-keys/{apiKey} → ApiKeyInfo（含明文 apiSecret）
    # 字面 {apiKey} 占位符由框架 RemoteApiKeyProvider 用调用方 X-Api-Key 头的值替换——丢占位符则替换失效、
    # 验签查不到凭据（潜伏 bug，#46 修复）。base-url 走 env，本地默认 app-registry 实际端口 8088（非 18080）。
    # identity 当前无 @RequireSignature 入站端点（鉴权走 SSO cookie），此 URL 暂潜伏；配对避免日后暴露签名端点时静默失效。
    apikey-service-url: ${APP_REGISTRY_BASE_URL:http://localhost:8088}/api/app-registry/api-keys/{apiKey}

# JWT token 配置（ADR-0002 / issue #11）
# private-key-path / public-key-path 默认不设 → 内存生成临时密钥（重启失效，prod 必须配 PEM）。
identity:
  token:
    jwt:
      issuer: https://identity.aieducenter.com
      access-ttl-seconds: 900
      refresh-ttl-seconds: 604800
      key-id: identity-rs256-v1
      audiences:
        - aieducenter-identity
  # SSO 配置（ADR-0004 / issue #15）——一套 SSO 会话（cookie+Redis+双超时）+ 授权码 + app-registry 远程解析
  sso:
    session-idle-seconds: 2592000      # 闲置超时 30 天（Redis key TTL 滑动）
    session-absolute-seconds: 7776000   # 绝对超时 90 天
    code-ttl-seconds: 60                # 授权码 60s 一次性
    cookie-name: sso_session
    cookie-secure: true
    login-page-url: https://login.company.com/login
    # 浏览器导航类端点（/authorize /logout）出错时 302 跳转的兜底页（ADR-0006，identity-web /error）
    error-page-url: https://identity.aieducenter.com/error
    protected-paths:
      - /api/account/me
      - /api/account/profile
      - /api/account/change-password
    # app-registry bootstrap 端点（#30 消费 SsoClient facet；test 指向 WireMock、prod 走 env）
    app-registry:
      base-url: ${APP_REGISTRY_BASE_URL:http://localhost:18080}
      connect-timeout-seconds: 3
      read-timeout-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
