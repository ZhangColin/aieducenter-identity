# dev 固定码（issue #29）：生成处固定、比对路径全真，QA/e2e 不依赖真实收码。
# prod 配置任一键将被 DevCodeProdGuard 拒绝启动。
verification:
  code:
    dev-code: "246810"
  captcha:
    dev-code: "qa58"

# 本地联调（issue #16/#27）：.localhost 多域 + identity-web 真实登录页
identity:
  sso:
    # /authorize 无 cookie → 302 到 identity-web 登录页（:10002，rewrite /api/* → :10001）
    # identity-web 没起时手工兜底：http://identity.localhost:10001/api/auth/dev-login
    login-page-url: http://identity.localhost:10002/login
    # app-registry 本地端口（../aieducenter-app-registry 本地起在 :10011）
    app-registry:
      base-url: http://localhost:10011
    dev-login:
      enabled: true
