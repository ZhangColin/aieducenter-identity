# 服务间签名（#31）：本地出站凭据占位。需与本地 app-registry 配置的 apiKey/Secret 一致，
# 否则本地解析 client 会被 app-registry @RequireSignature 拒（OpenApiClient blank 凭据首调即抛）。
cartisan:
  openapi:
    self:
      api-key: identity
      api-secret: 1rYMkknwQypZ1BQACNjcjW7T5qmwCcHHKOLAA9vKzFY

# dev 固定码（issue #29）：生成处固定、比对路径全真，QA/e2e 不依赖真实收码。
# prod 配置任一键将被 DevCodeProdGuard 拒绝启动。
verification:
  code:
    dev-code: "246810"
  captcha:
    dev-code: "qa58"

# 本地联调（issue #16/#27）：.localhost 多域 + identity-web 真实登录页
identity:
  sso:
    # local 跑 http://*.localhost：Safari/Firefox 不豁免 Secure-over-http（仅 Chrome/Edge 豁免），
    # Secure cookie 会被拒存 → sso_session 落不了地、SSO 会话不持久（issue #36）。故 local 关 Secure；
    # prod 走 https 仍用默认 true。
    cookie-secure: false
    # /authorize 无 cookie → 302 到 identity-web 登录页（:10002，rewrite /api/* → :10001）
    login-page-url: http://identity.localhost:10002/login
    # 浏览器类端点出错时 302 跳 identity-web 兜底页（:10002 /error，ADR-0006）
    error-page-url: http://identity.localhost:10002/error
    # app-registry 本地端口（../aieducenter-app-registry 本地起在 :8088，见其 application.yml server.port）
    app-registry:
      base-url: http://localhost:8088
